# Builds HushGram17 and publishes the .mpp as a GitHub Release.
# Triggered when you push a tag like v0.0.21-hg17.5 (upstream 0.0.21, fork build 5)
# or manually from Actions → Run workflow.
#
# Version scheme: gradle.properties holds plain numbers, <maj>.<min>.<upstream patch * 100 + fork build>,
# so tag v0.0.21-hg17.5 <=> version 0.0.2105. Morphe Manager compares the version inside the .mpp
# with patches-bundle.json, and a "-hg17.x" suffix would sort below the bare number.
# Before tagging: set version in gradle.properties and "version" in patches-list.json ("v0.0.2105").

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.0.21-hg17.5)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for version detection

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches the committed version
        id: version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          CORE="${TAG#v}"
          if [[ ! "$CORE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-hg17\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like v0.0.21-hg17.5 (upstream version, then -hg17.<fork build>)."
            exit 1
          fi
          MAJ="${BASH_REMATCH[1]}"; MIN="${BASH_REMATCH[2]}"; PAT="${BASH_REMATCH[3]}"; FORK="${BASH_REMATCH[4]}"
          if [ "$((10#$FORK))" -ge 100 ]; then
            echo "::error::Fork build must stay under 100 per upstream version."
            exit 1
          fi
          EXPECTED="$MAJ.$MIN.$((10#$PAT * 100 + 10#$FORK))"
          ACTUAL=$(grep -E '^version' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d ' \r')
          LISTED=$(grep -m1 '"version"' patches-list.json | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Tag $TAG -> expected version $EXPECTED (gradle.properties: $ACTUAL, patches-list.json: $LISTED)"
          if [ "$ACTUAL" != "$EXPECTED" ] || [ "$LISTED" != "$EXPECTED" ]; then
            echo "::error::Set version = $EXPECTED in gradle.properties and \"version\": \"v$EXPECTED\" in patches-list.json, then re-tag."
            exit 1
          fi
          echo "version=$EXPECTED" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the .mpp bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload Build Failure Logs and Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            gradle-build.log
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Find the bundle
        id: bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NEW_NAME="patches-${VERSION}.mpp"
          NEW_PATH="patches/build/release/${NEW_NAME}"
          if [ ! -f "$NEW_PATH" ]; then
            echo "::error::Expected $NEW_PATH but the build produced: $(ls patches/build/release)"
            exit 1
          fi
          echo "path=$NEW_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$NEW_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "HushGram17 ${{ steps.tag.outputs.tag }}"
          body: |
            HushGram17 build based on upstream HushGram.

            Bundle version `${{ steps.version.outputs.version }}` (tag ${{ steps.tag.outputs.tag }}).

            **Custom patches included:**
            - Save Instants — auto-captures view-once Instants for later viewing/download

            Download the `.mpp` and add it as a Local source in Morphe Manager,
            or add this repo as a remote source.
          files: ${{ steps.bundle.outputs.path }}
          draft: false
          prerelease: false

      - name: Update patches-bundle.json
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ steps.bundle.outputs.name }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S")
          cat > patches-bundle.json << EOF
          {
            "name": "HushGram17",
            "created_at": "${TIMESTAMP}",
            "description": "HushGram17 ${TAG} — personal fork with Save Instants patch.",
            "download_url": "${DOWNLOAD}",
            "signature_download_url": "",
            "version": "${VERSION}"
          }
          EOF

      - name: Commit updated bundle JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add patches-bundle.json
          git diff --cached --quiet || git commit -m "Update patches-bundle.json for ${{ steps.tag.outputs.tag }}"
          git push origin main
