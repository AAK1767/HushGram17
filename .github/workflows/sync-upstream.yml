name: Sync Upstream & Release

on:
  schedule:
    # Run every 3 days at midnight UTC (or change as desired)
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild and release even if already on latest tag'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/SysAdminDoc/HushGram.git || true
          git fetch upstream --tags
          git fetch upstream main

      - name: Check for New Upstream Release
        id: check_release
        run: |
          # gradle.properties holds <maj>.<min>.<upstream patch * 100 + fork build>,
          # e.g. 0.0.2105 = upstream 0.0.21, fork build 5 (tag v0.0.21-hg17.5).
          CURRENT_VERSION=$(grep -E "^version" gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d ' \r')
          echo "Current version: $CURRENT_VERSION"
          IFS=. read -r C_MAJ C_MIN C_PAT <<< "$CURRENT_VERSION"
          CURRENT_UPSTREAM="$C_MAJ.$C_MIN.$((10#$C_PAT / 100))"
          CURRENT_FORK=$((10#$C_PAT % 100))
          echo "Current upstream base: $CURRENT_UPSTREAM, fork build: $CURRENT_FORK"

          # Find latest upstream release tag (format: v0.0.XX)
          LATEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Latest upstream tag: $LATEST_TAG"
          UPSTREAM_VERSION="${LATEST_TAG#v}"
          IFS=. read -r U_MAJ U_MIN U_PAT <<< "$UPSTREAM_VERSION"

          NEEDS=false
          FORK=1
          if [ "$CURRENT_UPSTREAM" != "$UPSTREAM_VERSION" ]; then
            NEEDS=true            # new upstream release: fork build restarts at 1
          elif [ "${{ inputs.force_build }}" = "true" ]; then
            NEEDS=true            # forced rebuild: next fork build, so Manager sees an update
            FORK=$((CURRENT_FORK + 1))
          fi
          if [ "$FORK" -ge 100 ]; then
            echo "::error::Fork build must stay under 100 per upstream version."
            exit 1
          fi

          NEW_VERSION="$U_MAJ.$U_MIN.$((10#$U_PAT * 100 + FORK))"
          NEW_TAG="v${UPSTREAM_VERSION}-hg17.${FORK}"
          echo "New version: $NEW_VERSION, new tag: $NEW_TAG"

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "needs_update=$NEEDS" >> "$GITHUB_OUTPUT"

      - name: Merge Upstream Release
        if: steps.check_release.outputs.needs_update == 'true'
        run: |
          LATEST_TAG="${{ steps.check_release.outputs.latest_tag }}"
          NEW_VERSION="${{ steps.check_release.outputs.new_version }}"
          echo "Merging $LATEST_TAG into main..."
          # --no-commit stops before the merge commit, so the conflicts every fork merge hits can be
          # resolved first. A plain merge failed here on CHANGELOG.md, README.md, gradle.properties,
          # patches-list.json and DefaultCatalogTest.kt.
          git merge "$LATEST_TAG" --no-commit --no-ff || echo "Merge stopped on conflicts; resolving the known files."
          # Resolves those files and fixes the drift a clean auto-merge leaves in the catalog test.
          # Exits 2, and fails this job, on any conflict it doesn't know, so a person looks at that one.
          python3 scripts/resolve-upstream-merge.py --version "$NEW_VERSION"
          if [ -f .git/MERGE_HEAD ]; then
            git commit -m "Merge upstream $LATEST_TAG into main"
          fi

          # The next step regenerates the patch list; this keeps its version right until then.
          sed -i "0,/\"version\": \"v[^\"]*\"/s//\"version\": \"v$NEW_VERSION\"/" patches-list.json

      - name: Setup Java
        if: steps.check_release.outputs.needs_update == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        if: steps.check_release.outputs.needs_update == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Python
        if: steps.check_release.outputs.needs_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate Patch List and README Table
        if: steps.check_release.outputs.needs_update == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :patches:generatePatchesList --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          python -I -X utf8 scripts/gen-readme-patches.py

      - name: Build Patches Bundle (.mpp)
        if: steps.check_release.outputs.needs_update == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload Build Failure Logs and Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-failure-logs
          path: |
            gradle-build.log
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Find Built Bundle
        if: steps.check_release.outputs.needs_update == 'true'
        id: bundle
        run: |
          MPP=$(ls patches/build/release/*.mpp 2>/dev/null | head -1)
          echo "path=$MPP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $MPP)" >> "$GITHUB_OUTPUT"

      - name: Update patches-bundle.json
        if: steps.check_release.outputs.needs_update == 'true'
        run: |
          TAG="${{ steps.check_release.outputs.new_tag }}"
          VERSION="${{ steps.check_release.outputs.new_version }}"
          DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ steps.bundle.outputs.name }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S")
          cat > patches-bundle.json << EOF
          {
            "name": "HushGram17",
            "created_at": "${TIMESTAMP}",
            "description": "HushGram17 ${TAG} — personal fork with Save Instants patch.",
            "download_url": "${DOWNLOAD}",
            "signature_download_url": "",
            "version": "${VERSION}"
          }
          EOF
          git add gradle.properties patches-list.json patches-bundle.json README.md
          git diff --cached --quiet || git commit -m "Bump version to $VERSION and update patches-bundle.json"
          git push origin main

      - name: Publish GitHub Release
        if: steps.check_release.outputs.needs_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.new_tag }}
          name: "HushGram17 ${{ steps.check_release.outputs.new_tag }}"
          body: |
            Automated HushGram17 build based on upstream release ${{ steps.check_release.outputs.latest_tag }}.

            Bundle version `${{ steps.check_release.outputs.new_version }}`.

            **Custom patches included:**
            - Save Instants — auto-captures view-once Instants for later viewing/download

            Download the `.mpp` below or configure this repo as your remote source in Morphe Manager.
          files: ${{ steps.bundle.outputs.path }}
          draft: false
          prerelease: false
